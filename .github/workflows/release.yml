name: Release

# Push a tag "v<version>" (the version in pins.json) to build, test and prepare:
#   Trurl_<v>_x64-setup.exe          + .sig   what the desktop updater installs
#   Trurl_<v>_x64-offline-setup.exe            for USB sticks (includes WebView2)
#   trurl-<v>-linux-x64.tar.gz       + .sig   terminal app, glibc 2.31+
#   latest.json                                the update manifest
#   SHA256SUMS.txt
# The release is created as a DRAFT: learners get nothing until a maintainer
# reviews it and clicks "Publish release" on GitHub. See docs/RELEASING.md.
#
# Supply chain: llama-server is rebuilt from the pinned source (no cache), and
# the updater signing key exists only in the one step that signs, in a job that
# builds no project code.
#
# Windows code signing (so SmartScreen does not block the installers): SignPath
# Foundation signs trurl.exe, then the two installers, from GitHub artifacts of
# this run. Each request waits for a maintainer to approve it on signpath.io.
# Off until the repository variable SIGNPATH_ORGANIZATION_ID is set; until then
# the installers are unsigned, as before. Setup: docs/RELEASING.md.
#
# "Run workflow" on the Actions tab does a dry run of the same jobs on any
# branch: no tag check, no release, and code signing only if asked.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign:
        description: "Code-sign the Windows files with SignPath (needs approval on signpath.io)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360   # build ~35 min, plus up to 2 h for each SignPath approval
    permissions:
      contents: read
      actions: read   # SignPath reads this run's artifacts to verify their origin
    defaults:
      run:
        shell: pwsh
    env:
      TRURL_TEST_MODELS: ${{ github.workspace }}/../trurl-models
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && (github.event_name == 'push' || inputs.sign) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches pins.json
        if: github.event_name == 'push'
        run: |
          $v = (Get-Content pins.json | ConvertFrom-Json).app.version
          if ("${{ github.ref_name }}" -ne "v$v") { throw "tag ${{ github.ref_name }} != v$v" }
      - name: Build llama-server from the pinned source (no cache)
        run: python scripts/build_llama.py
      - run: python scripts/check_pe_imports.py vendor/llama/windows
      - name: llama.cpp's own code uses only its CPU tier's instructions
        env:
          OBJDUMP: C:\Program Files\LLVM\bin\llvm-objdump.exe
        run: |
          $c = (Get-Content pins.json | ConvertFrom-Json).llama_cpp.commit.Substring(0, 12)
          python scripts/check_cpu_isa.py --objects "$HOME/.cache/trurl/build-windows-$c"
          if ($LASTEXITCODE -ne 0) { throw "CPU tier check failed" }
      - name: Each build answers on an emulated CPU of its tier (Intel SDE)
        run: |
          python scripts/fetch_models.py --dest $env:TRURL_TEST_MODELS --test-models
          if ($LASTEXITCODE -ne 0) { throw "fetch_models failed" }
          python scripts/check_cpu_emulated.py vendor/llama/windows --model "$env:TRURL_TEST_MODELS/stories260K-f32.gguf"
          if ($LASTEXITCODE -ne 0) { throw "a build crashed on its oldest CPU" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Tauri CLI from its lockfile, then the icons from branding/app-icon.svg
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npx --no -- tauri icon ../../branding/app-icon.svg -o src-tauri/icons
      - name: Version
        run: echo "V=$((Get-Content pins.json | ConvertFrom-Json).app.version)" >> $env:GITHUB_ENV
      - name: trurl.exe, marked as installed by NSIS before anything signs it
        working-directory: apps/desktop
        run: |
          npx --no -- tauri build --no-bundle -- --locked
          python ../../scripts/patch_bundle_type.py ../../target/release/trurl.exe nsis
          if ($LASTEXITCODE -ne 0) { throw "bundle type marker" }
      - name: trurl.exe for signing
        if: env.SIGN == 'true'
        id: exe-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trurl-exe-unsigned
          path: target/release/trurl.exe
          if-no-files-found: error
          overwrite: true   # a re-run after an approval timeout uploads again
      - name: Sign trurl.exe (SignPath; approve the request on signpath.io)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: trurl
          signing-policy-slug: release-signing
          artifact-configuration-slug: trurl-exe
          github-artifact-id: ${{ steps.exe-unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.V) }}
          wait-for-completion-timeout-in-seconds: 7200   # 2 h to approve on signpath.io
          output-artifact-directory: target/signed-exe
      - name: The signed trurl.exe goes into the installers
        if: env.SIGN == 'true'
        run: |
          $s = Get-AuthenticodeSignature target/signed-exe/trurl.exe
          if ($s.Status -ne "Valid") { throw "signed trurl.exe: $($s.Status) $($s.StatusMessage)" }
          Copy-Item target/signed-exe/trurl.exe target/release/trurl.exe -Force
      - name: Update installer (small; WebView2 fetched only if missing)
        working-directory: apps/desktop
        run: |
          # --no-binary-patching: trurl.exe is already marked (and maybe signed).
          npx --no -- tauri bundle --bundles nsis --no-binary-patching
          New-Item -ItemType Directory -Force ../../dist | Out-Null
          Copy-Item "../../target/release/bundle/nsis/Trurl_${env:V}_x64-setup.exe" ../../dist/
      - name: USB installer (embeds the WebView2 offline installer)
        working-directory: apps/desktop
        run: |
          npx --no -- tauri bundle --bundles nsis --no-binary-patching --config src-tauri/tauri.usb.conf.json
          Copy-Item "../../target/release/bundle/nsis/Trurl_${env:V}_x64-setup.exe" "../../dist/Trurl_${env:V}_x64-offline-setup.exe"
      - name: Installers for signing
        if: env.SIGN == 'true'
        id: installers-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-unsigned
          path: dist/*.exe
          if-no-files-found: error
          overwrite: true   # a re-run after an approval timeout uploads again
      - name: Sign the installers (SignPath; approve the request on signpath.io)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: trurl
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.installers-unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.V) }}
          wait-for-completion-timeout-in-seconds: 7200   # 2 h to approve on signpath.io
          output-artifact-directory: target/signed-installers
      - name: Signed installers replace the unsigned ones
        if: env.SIGN == 'true'
        run: |
          foreach ($f in "Trurl_${env:V}_x64-setup.exe", "Trurl_${env:V}_x64-offline-setup.exe") {
            $s = Get-AuthenticodeSignature "target/signed-installers/$f"
            if ($s.Status -ne "Valid") { throw "$f`: $($s.Status) $($s.StatusMessage)" }
            Write-Host "$f signed by $($s.SignerCertificate.Subject)"
            Copy-Item "target/signed-installers/$f" "dist/$f" -Force
          }
      - name: Unsigned build
        if: env.SIGN != 'true'
        run: Write-Host "::warning::Windows installers are NOT code-signed (SignPath not set up or not requested). SmartScreen will warn. See docs/RELEASING.md."
      - name: Models for the smoke test
        run: python scripts/fetch_models.py --dest $env:TRURL_TEST_MODELS --only gemma-3-1b-it,qwen3-0.6b
      - name: Smoke-test the USB installer exactly as a teacher uses it
        run: ./scripts/windows_smoke.ps1 -Installer "dist/Trurl_${env:V}_x64-offline-setup.exe" -ExpectSigned:($env:SIGN -eq 'true')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-smoke-screenshots
          path: target/e2e/
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    # Debian 11: glibc 2.31, so the result runs on Ubuntu 20.04+ and Debian 11+.
    # Debian 11 (glibc 2.31) so the Linux build runs on older distributions too.
    # Pinned by digest: the tag moves with every Debian point release.
    container: debian:bullseye@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9
    steps:
      # Bullseye reached end of life on 2026-08-31 and its packages moved to
      # archive.debian.org (deb.debian.org now answers 404 for them). Signatures
      # are still checked with the image's own Debian keyring.
      - name: Debian 11 packages from archive.debian.org
        run: |
          printf '%s\n' \
            'deb http://archive.debian.org/debian bullseye main' \
            'deb http://archive.debian.org/debian bullseye-updates main' \
            'deb http://archive.debian.org/debian-security bullseye-security main' \
            > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*
      - run: apt-get update && apt-get install -y --no-install-recommends build-essential ca-certificates curl git python3 ninja-build binutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned CMake
        run: |
          curl -sSL -o /tmp/cmake.tgz https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
          echo "5a1133ff103c71eb5120e2cc3de922733e7d8a26a98ae716397e8676adb367bf  /tmp/cmake.tgz" | sha256sum -c -
          tar -xzf /tmp/cmake.tgz -C /opt
          echo "/opt/cmake-3.31.6-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Pinned Rust
        run: |
          curl -sSfo /tmp/rustup-init https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
          echo "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: python3 scripts/build_llama.py
      - run: python3 scripts/check_cpu_isa.py vendor/llama/linux
      - run: bash scripts/package_linux.sh
      - name: Runs on Ubuntu 20.04 / Debian 11 and newer (glibc 2.31)
        run: python3 scripts/check_glibc.py --max 2.31 target/release/trurl vendor/llama/linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/*.tar.gz

  publish:
    needs: [windows, linux]
    if: github.event_name == 'push'   # a dry run stops before the updater key and the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # gh uses GH_TOKEN; no token left in .git/config while crates build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux
          path: dist
      - name: Version
        run: echo "V=$(python3 -c 'import json;print(json.load(open("pins.json"))["app"]["version"])')" >> "$GITHUB_ENV"
      - name: Tauri CLI from its lockfile (before any secret is in the environment)
        run: npm ci --prefix apps/desktop --no-audit --no-fund --ignore-scripts
      - name: Sign the update files (the only step that sees the key)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # The CLI comes from apps/desktop/package-lock.json (hash-checked by npm ci),
          # installed before the key is in the environment: nothing unpinned runs with it.
          tauri=apps/desktop/node_modules/.bin/tauri
          "$tauri" signer sign --app-version "$V" "dist/Trurl_${V}_x64-setup.exe"
          "$tauri" signer sign --app-version "$V" "dist/trurl-${V}-linux-x64.tar.gz"
      - name: Check every signature the way installed copies of Trurl will
        run: |
          cargo run --locked --quiet -p trurl-core --example verify_update -- "dist/Trurl_${V}_x64-setup.exe" "dist/Trurl_${V}_x64-setup.exe.sig" "$V"
          cargo run --locked --quiet -p trurl-core --example verify_update -- "dist/trurl-${V}-linux-x64.tar.gz" "dist/trurl-${V}-linux-x64.tar.gz.sig" "$V"
      - name: Manifest, checksums, draft release
        env:
          GH_TOKEN: ${{ github.token }}
          # Same condition as the windows job's SIGN on a tag push (this job runs only then).
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          python3 scripts/release_notes.py "$V" > notes.md
          python3 scripts/make_manifest.py --version "$V" --notes-file notes.md \
            --windows "dist/Trurl_${V}_x64-setup.exe" \
            --linux "dist/trurl-${V}-linux-x64.tar.gz" --out dist/latest.json
          (cd dist && sha256sum *.exe *.tar.gz > SHA256SUMS.txt)
          # The release page (not the in-app update card) also links the signing policy,
          # and credits SignPath only when this release was actually signed.
          cp notes.md release.md
          if [ "$SIGNED" = true ]; then
            printf '\n\n---\nFree code signing provided by SignPath.io, certificate by SignPath Foundation. [Code signing policy](https://github.com/jbarbier/trurl/blob/main/docs/CODE-SIGNING.md)\n' >> release.md
          else
            printf '\n\n---\nThe Windows installers of this release are not code-signed. [Code signing policy](https://github.com/jbarbier/trurl/blob/main/docs/CODE-SIGNING.md)\n' >> release.md
          fi
          gh release create "v$V" --draft --title "Trurl $V" --notes-file release.md dist/*
