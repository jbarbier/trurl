name: Release

# Push a tag "v<version>" (the version in pins.json) to build and publish:
#   Trurl_<v>_x64-setup.exe          + .sig   what the desktop updater installs
#   Trurl_<v>_x64-offline-setup.exe            for USB sticks (includes WebView2)
#   trurl-<v>-linux-x64.tar.gz       + .sig   terminal app, glibc 2.31+
#   latest.json                                the update manifest
#   SHA256SUMS.txt
# See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches pins.json
        run: |
          $v = (Get-Content pins.json | ConvertFrom-Json).app.version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") { throw "tag ${{ github.ref_name }} != v$v" }
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/trurl
            vendor/llama
          key: llama-release-windows-${{ hashFiles('pins.json', 'scripts/build_llama.py') }}
      - run: if (-not (Test-Path vendor/llama/windows/compat/llama-server.exe)) { python scripts/build_llama.py }
      - run: python scripts/check_pe_imports.py vendor/llama/windows
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npx --yes @tauri-apps/cli@2.12.2 icon branding/app-icon.svg -o apps/desktop/src-tauri/icons
      - name: Update installer (small, signed for the updater)
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@2.12.2 build
          New-Item -ItemType Directory -Force ../../dist | Out-Null
          Copy-Item ../../target/release/bundle/nsis/*-setup.exe ../../dist/
          Copy-Item ../../target/release/bundle/nsis/*-setup.exe.sig ../../dist/
      - name: USB installer (embeds the WebView2 offline installer for Windows 10 PCs without it)
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@2.12.2 build --config '{\"bundle\":{\"windows\":{\"webviewInstallMode\":{\"type\":\"offlineInstaller\",\"silent\":true}}}}'
          $exe = Get-ChildItem ../../target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName ("../../dist/" + $exe.Name.Replace("-setup.exe", "-offline-setup.exe"))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/

  linux:
    runs-on: ubuntu-24.04
    # Debian 11: glibc 2.31, so the result runs on Ubuntu 20.04+ and Debian 11+.
    container: debian:bullseye
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends build-essential ca-certificates curl git python3 ninja-build binutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned CMake
        run: |
          curl -sSL -o /tmp/cmake.tgz https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
          tar -xzf /tmp/cmake.tgz -C /opt
          echo "/opt/cmake-3.31.6-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Pinned Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/build_llama.py
      - run: bash scripts/package_linux.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/*.tar.gz

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Sign the Linux tarball with the updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2.12.2 signer sign dist/trurl-*-linux-x64.tar.gz
      - name: Manifest, checksums, release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c 'import json;print(json.load(open("pins.json"))["app"]["version"])')
          python3 scripts/release_notes.py "$V" > notes.md
          python3 scripts/make_manifest.py --version "$V" --notes-file notes.md \
            --windows "dist/Trurl_${V}_x64-setup.exe" \
            --linux "dist/trurl-${V}-linux-x64.tar.gz" --out dist/latest.json
          (cd dist && sha256sum *.exe *.tar.gz > SHA256SUMS.txt)
          gh release create "v$V" --title "Trurl $V" --notes-file notes.md dist/*
