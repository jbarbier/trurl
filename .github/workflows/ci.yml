name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRURL_TEST_MODELS: ${{ github.workspace }}/../trurl-models

# No job here sees the real update-signing key: builds do not sign
# (createUpdaterArtifacts is off), and the update test uses a throwaway key.

jobs:
  gates:
    name: Gates (fmt, clippy, unit tests, repo checks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 scripts/check_pins.py
      - run: python3 scripts/check_copy.py
      - run: python3 scripts/check_network.py

  linux:
    name: Linux evals (real llama-server, network blocked) and UI e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: linux-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Cache llama.cpp source, builds and models
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/trurl
            vendor/llama
            ${{ env.TRURL_TEST_MODELS }}
          key: llama-models-linux-${{ hashFiles('pins.json', 'scripts/build_llama.py') }}
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: rustup toolchain install
      - name: Build llama-server (avx2, avx, compat)
        run: test -x vendor/llama/linux/compat/llama-server || python3 scripts/build_llama.py
      - name: Each llama-server build uses only its CPU tier's instructions
        run: python3 scripts/check_cpu_isa.py vendor/llama/linux && python3 scripts/check_pe_imports.py vendor/llama/linux
      - name: Each build answers on an emulated CPU of its tier (Intel SDE)
        run: |
          python3 scripts/fetch_models.py --dest "$TRURL_TEST_MODELS" --test-models
          python3 scripts/check_cpu_emulated.py vendor/llama/linux --model "$TRURL_TEST_MODELS/stories260K-f32.gguf"
      - name: Evals, offline
        run: bash scripts/run_evals.sh
      - name: UI end-to-end (bridge + Chromium at 1366x768)
        run: bash apps/bridge/e2e/run.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-screenshots
          path: target/e2e/
          if-no-files-found: ignore

  windows:
    name: Windows build, installer, offline smoke test
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Cache llama.cpp source, builds and models
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/trurl
            vendor/llama
            ${{ env.TRURL_TEST_MODELS }}
          key: llama-models-windows-${{ hashFiles('pins.json', 'scripts/build_llama.py') }}
      - run: rustup toolchain install
      - name: Build llama-server (avx2, avx, compat), static, no VC++ runtime
        run: if (-not (Test-Path vendor/llama/windows/compat/llama-server.exe)) { python scripts/build_llama.py }
      - name: Check llama-server needs no DLL beyond Windows itself
        run: python scripts/check_pe_imports.py vendor/llama/windows
      - name: llama.cpp's own code uses only its CPU tier's instructions
        env:
          OBJDUMP: C:\Program Files\LLVM\bin\llvm-objdump.exe
        run: |
          $c = (Get-Content pins.json | ConvertFrom-Json).llama_cpp.commit.Substring(0, 12)
          python scripts/check_cpu_isa.py --objects "$HOME/.cache/trurl/build-windows-$c"
          if ($LASTEXITCODE -ne 0) { throw "CPU tier check failed" }
      - name: Each build answers on an emulated CPU of its tier (Intel SDE)
        run: |
          python scripts/fetch_models.py --dest $env:TRURL_TEST_MODELS --test-models
          if ($LASTEXITCODE -ne 0) { throw "fetch_models failed" }
          python scripts/check_cpu_emulated.py vendor/llama/windows --model "$env:TRURL_TEST_MODELS/stories260K-f32.gguf"
          if ($LASTEXITCODE -ne 0) { throw "a build crashed on its oldest CPU" }
      - name: Unit tests
        run: cargo test --locked -p trurl-core
      - name: Evals with outbound network blocked by the firewall
        run: ./scripts/run_evals.ps1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Tauri CLI from its lockfile, then the icons from branding/app-icon.svg
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npx --no -- tauri icon ../../branding/app-icon.svg -o src-tauri/icons
      - name: Build the USB installer
        working-directory: apps/desktop
        run: |
          npx --no -- tauri build --config src-tauri/tauri.usb.conf.json -- --locked
          # Named like the release asset, so docs/USB-BUNDLE.md works before the first release.
          New-Item -ItemType Directory -Force ../../target/usb | Out-Null
          $exe = Get-ChildItem ../../target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName ("../../target/usb/" + $exe.Name.Replace("-setup.exe", "-offline-setup.exe"))
      - name: Install from a USB-style folder, run offline, chat, uninstall
        run: ./scripts/windows_smoke.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-installer-and-screenshots
          path: |
            target/usb/*.exe
            target/e2e/
          if-no-files-found: ignore

  windows-update:
    name: Windows self-update, version N to N+1, models kept
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-update-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Cache llama.cpp source, builds and models
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/trurl
            vendor/llama
            ${{ env.TRURL_TEST_MODELS }}
          key: llama-models-windows-${{ hashFiles('pins.json', 'scripts/build_llama.py') }}
      - run: rustup toolchain install
      - run: if (-not (Test-Path vendor/llama/windows/compat/llama-server.exe)) { python scripts/build_llama.py }
      - run: python scripts/fetch_models.py --dest $env:TRURL_TEST_MODELS --only qwen3-0.6b
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Tauri CLI from its lockfile, then the icons from branding/app-icon.svg
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npx --no -- tauri icon ../../branding/app-icon.svg -o src-tauri/icons
      - name: Build N, install it, build and sign N+1, update through the real window
        run: ./scripts/windows_update_test.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-update-screenshots
          path: target/e2e/
          if-no-files-found: ignore
